<style>
:root{--ink:#142d38;--muted:#556b73;--line:#d9e2e3;--paper:#fff;--bg:#f4f6f4;--accent:#12675e;--soft:#edf6f0;--focus:#e5b84a;--error:#a42e2e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}a{color:var(--accent)}header{border-bottom:1px solid var(--line);background:#fff}.top{max-width:1160px;margin:auto;padding:22px 32px;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-weight:750;letter-spacing:-.025em;font-size:19px}.badge{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);font-weight:700}.layout{max-width:1160px;margin:44px auto;padding:0 32px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:52px}aside{align-self:start;position:sticky;top:24px}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.12em;font-size:12px;text-transform:uppercase}h1{font-size:clamp(28px,4vw,38px);line-height:1.17;letter-spacing:-.035em;margin:12px 0 16px;font-weight:700}h2{font-size:21px;line-height:1.3;letter-spacing:-.015em}h3{font-size:18px;margin:0 0 12px}p{margin:0 0 16px}.muted,.hint{color:var(--muted)}.hint{font-size:14px;margin-top:6px}.aside-intro{font-size:14px;color:var(--muted);margin:14px 0 26px}.steps{list-style:none;padding:0;margin:0}.steps li{margin:0 0 9px}.step-link{padding:8px 0;text-align:left;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;gap:11px;width:100%;font-size:14px}.step-link span{border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;width:25px;height:25px;flex:none;font-size:12px}.step-link[aria-current="step"]{font-weight:700;color:var(--accent)}.step-link[aria-c --line);border-radius:12px;margin:14px 0}.rowhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650}.rowcard .field{margin:13px 0}.btn{border:1px solid var(--accent);border-radius:9px;min-height:48px;padding:11px 20px;font-weight:650;background:var(--accent);color:#fff;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}.btn.secondary{background:white;color:var(--accent)}.btn.quiet{border-color:var(--line);color:var(--muted);background:transparent;font-size:14px;padding:8px 12px;min-height:44px}.btn.small{font-size:14px;padding:7px 12px;min-height:44px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;border-top:1px solid var(--line);padding-top:22px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.utilities{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.utilities button{font-size:13px;min-height:44px;border:0;background:none;text-decoration:underline;text-underline-offset:4px;color:var(--muted);padding:6px 8px}details{border-top:1px solid var(--line);padding-top:16px;margin-top:25px}summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:44px}.error{color:var(--error);font-size:14px}.error:empty{display:none}.review-section{border-top:1px solid var(--line);padding:20px 0 4px}.review-section h2{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:19px}.answer{margin:13px 0}.answer dt{font-weight:650;font-size:14px}.answer dd{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;color:#35515d}.quick{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}.quick button{min-height:44px;border:0;background:transparent;color:var(--accent);font-size:13px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}.tag{font-size:12px;background:#e6efed;border-radius:5px;padding:4px 8px;color:var(--accent)}footer{font-size:12px;color:var(--muted);margin:22px 0 40px}#status{min-height:24px;font-size:14px;c <body>
<a class="skip-link" href="#page-title">Перейти к содержанию</a><header><div class="top"><span class="service-name">Бриф для подготовки документа</span></div></header>
<div class="layout">
<aside aria-label="Разделы брифа"><ol class="steps" id="steps"></ol></aside>
<main id="main-content"><div id="progress"><div class="progress-caption"><span id="progress-label"></span><span id="section-label"></span></div><div class="progress-track" id="progress-bar" role="progressbar" aria-label="Заполнение брифа" aria-valuemin="0" aria-valuemax="7"><div class="progress-fill" id="progress-fill"></div></div></div><div class="card"><div id="status" role="status" aria-live="polite"></div><div id="error" class="error-summary" role="alert" tabindex="-1"></div><div id="screen"></div><div class="nav" id="nav"><button class="btn secondary" id="back" type="button">Назад</button><button class="btn" id="next" type="button">Далее →</button></div></div><div class="utilities" id="utilities"><button type="button" id="save-draft">Сохранить черновик</button><button type="button" id="load-draft">Продолжить из файла</button><details><summary>Другие действия</summary><button type="button" id="reset">Удалить все ответы</button></details></div><input type="file" id="import-file" aria-label="Загрузить черновик" accept="application/json,.json"></main>
</div>
<script>
'use strict';
const VERSION=2;
const OUTCOMES=['Получить или вернуть деньги','Добиться исполнения договорённости','Прекратить договор или обязательство','Вернуть, сохранить или разделить имущество','Расторгнуть брак','Установить или изменить выплаты на содержание','Определить проживание ребёнка или общение с ним','Восстановиться на работе','Оспорить требования работника или бывшего работника','Удалить сведения, опровергнуть их или прекратить использование объекта','Оспорить предъявленные мне требования','Другое','Пока не могу сформулировать'];
const PERSONAL_OUTCOMES=new Set(['Расторгнуть брак','Установить или изменить выплаты на содержание','Определить проживание ребёнка или общение с ним','Восстановиться на работе']);
const isBusinessProfile=profile=>['Индивидуальный предприниматель','Представитель организации'].includes(profile);
function outcomesFor(profile=val('profile')){return isBusinessProfile(profile)?OUTCOMES.filter(value=>!PERSONAL_OUTCOMES.has(value)):OUTCOMES;}
function compatibleOutcomes(answers){return (Array.isArray(answers.outcomes)?answers.outcomes:[]).filter(value=>!isBusinessProfile(answers.profile)||!PERSONAL_OUTCOMES.has(value));}
const DOCS=['Договоры, приложения или соглашения','Платежи, чеки, выписки или расписки','Переписка, обращения и ответы','Фото, видео, ссылки или публикации','Акты, оценки, заключения или расчёты','Документы о браке, детях или имуществе','Документы о работе и увольнении','Документы о правах на интеллектуальную собственность','Иск, приложения к нему и документы суда','Другие документы','Документов пока нет'];
const STEPS=['О вас и проблеме','Желаемый результат','События и позиции','Денежные требования','Документы','Связь с вами','Проверка и выгрузка'];
let state={version:VERSION,answers:{},events:[{date:'',event:''}],payments:[],step:-1};
let returnToReview=false;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const val=k=>state.answers[k]??'';
const arr=k=>Array.isArray(val(k))?val(k):[];
const hasMoney=()=>val('money_needed')==='Да';
const input=(k,label,hint='',type='text')=>`<div class="field"><label class="field-label" for="f-${esc(k)}">${esc(label)}</label><input id="f-${esc(k)}" data-key="${esc(k)}" type="${type}" value="${esc(val(k))}" ${hint?`aria-describedby="h-${esc(k)}"`:''}>${hint?`<p class="hint" id="h-${esc(k)}">${esc(hint)}</p>`:''}</div>`;
function quickOptions(key){
 const options={missing_docs:[['Не знаю','Не знаю'],['Всё передам','Всё имеющееся передам']],weaknesses:[['Таких нет','Таких обстоятельств нет'],['Не знаю','Не знаю']],participants:[['Других нет','Других участников нет'],['Есть в документах','Есть в переданных документах']],last_note:[['Добавить нечего','Добавить нечего']]};
 return options[key]||[['Есть в документах','Есть в переданных документах'],['Не знаю','Не знаю']];
}
const area=(k,label,hint='',quick=true)=>`<div class="field"><label class="field-label" for="f-${esc(k)}">${esc(label)}</label><textarea id="f-${esc(k)}" data-key="${esc(k)}" rows="3" ${k==='problem'?'aria-required="true"':''} ${hint?`aria-describedby="h-${esc(k)}"`:''}>${esc(val(k))}</textarea>${k==='problem'?'<p id="error-problem" class="field-error"></p>':''}${quick?`<div class="quick">${quickOptions(k).map(([label,value])=>`<button type="button" data-fill="${esc(k)}" data-value="${esc(value)}">${esc(label)}</button>`).join('')}</div>`:''}${hint?`<p class="hint" id="h-${esc(k)}">${esc(hint)}</p>`:''}</div>`;
function choices(k,label,options,multi=false,hint=''){
 return `<fieldset class="field"><legend>${esc(label)}</legend>${k==='profile'?'<p id="error-profile" class="field-error"></p>':''}${hint?`<p class="hint">${esc(hint)}</p>`:''}<div class="choices">${options.map((o,i)=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<label class="choice"><input type="${multi?'checkbox':'radio'}" name="${esc(k)}" data-key="${esc(k)}" value="${esc(v)}" ${(multi?arr(k).includes(v):val(k)===v)?'checked':''}><span>${esc(t)}</span></label>`}).join('')}</div></fieldset>`;
}
const notice=(text,neutral=false)=>`<div class="notice ${neutral?'neutral':''}">${esc(text)}</div>`;
const title=(n,t,p)=>`<h1 id="page-title" tabindex="-1">${esc(t)}</h1><p class="lead">${esc(p)}</p>`;
function eventRows(){return state.events.map((r,i)=>`<div class="rowcard"><div class="rowhead">Событие ${i+1}<button type="button" class="btn quiet small" data-remove-event="${i}" aria-label="Удалить событие ${i+1}">Удалить</button></div><div class="field"><label class="field-label" for="event-date-${i}">Когда</label><input id="event-date-${i}" data-event="${i}" data-prop="date" value="${esc(r.date)}" placeholder="Дата, месяц или «не помню»"></div><div class="field"><label class="field-label" for="event-text-${i}">Что произошло</label><textarea id="event-text-${i}" data-event="${i}" data-prop="event" rows="2">${esc(r.event)}</textarea></div></div>`).join('')}
function paymentRows(){return state.payments.map((r,i)=>`<div class="rowcard"><div class="rowhead">Сумма ${i+1}<button type="button" class="btn quiet small" data-remove-payment="${i}" aria-label="Удалить сумму ${i+1}">Удалить</button></div>${[['purpose','За что эта сумма'],['amount','Сумма и валюта'],['date','Когда заплатили или должны были заплатить'],['proof','Чем подтверждается / где найти в документах']].map(([k,l])=>`<div class="field"><label class="field-label" for="pay-${i}-${k}">${l}</label><input id="pay-${i}-${k}" data-payment="${i}" data-prop="${k}" value="${esc(r[k])}"></div>`).join('')}</div>`).join('')}
function welcome(){return `<h1 id="page-title" tabindex="-1">Бриф для подготовки документа</h1><p class="welcome-lead">Ответьте на вопросы о вашей ситуации. Это поможет юристу подготовить претензию, иск или отзыв на иск.</p><p class="time-note">Примерно 10–15 минут · 7 разделов</p><div class="welcome-info"><h2>Как заполнить</h2><p>Отвечайте своими словами. Если чего-то не знаете, укажите это; сведения из документов переписывать не нужно.</p><h2>Что сделать в конце</h2><p>Проверьте ответы, скачайте файл и отправьте его юристу вместе с документами. Форма ничего не отправляет автоматически.</p><h2>Ответы остаются у вас</h2><p>Данные обрабатываются на вашем устройстве в открытой вкладке и не отправляются на сервер.</p><p class="hint save-note">Чтобы не потерять ответы при закрытии страницы, скачайте черновик. Его можно загрузить и продолжить позже.</p></div><div class="start-actions"><button class="btn" type="button" id="start">Начать заполнение <span aria-hidden="true">→</span></button><button class="text-button" type="button" id="resume">Продолжить из черновика</button></div>`;}
function content(){switch(state.step){
 case -1:return welcome();
 case 0:return title('Начало','О вас и вашей ситуации','Кратко опишите проблему. Данные из документов переносить не нужно.')+`<p class="hint">На этой странице оба вопроса обязательны. В остальных разделах можно пропускать неизвестные сведения.</p>`+choices('profile','Вы обращаетесь как…',['Физическое лицо','Индивидуальный предприниматель','Представитель организации','Нужна помощь с определением статуса'])+area('problem','Кратко опишите, в чём проблема','Два-три предложения: что произошло, с кем возник спор и что вас не устраивает.',false);
 case 1:return title('Ваш ориентир','Что должно измениться?','Можно выбрать несколько результатов. Не нужно заранее знать, какой документ для этого потребуется.')+choices('outcomes','Чего вы хотите добиться?',outcomesFor(),true,isBusinessProfile(val('profile'))?'Варианты для обращения от имени ИП или организации. Если вопрос касается вас лично, измените статус на первом шаге.':'')+input('priority','Какой результат для вас главный?','Короткая фраза. Можно написать «обсуждали с юристом» или «нужна помощь».');
 case 2:return title('Факты','Ключевые события и позиции','Достаточно нескольких важных событий. Подробности из документов переписывать не нужно.')+`<div id="events">${eventRows()}</div><button class="btn secondary small" type="button" id="add-event">+ Добавить событие</button>`+area('opponent','Что утверждает или предлагает другая сторона?','Коротко, либо «изложено в присланной претензии / иске / переписке», либо «позиция неизвестна».')+area('disagreement','С чем именно вы не согласны?','Если требования предъявлены вам: что признаёте, что оспариваете и почему. Можно сослаться на пункт документа.')+area('weaknesses','Что ещё важно учесть, даже если это не в вашу пользу?','Например: задержка с вашей стороны, частичная оплата, подписанный акт, отсутствие оригинала. Либо «не знаю / такого нет».');
 case 3:return title('Исходные суммы','Нужны ли денежные требования?','Юрист подготовит расчёт. От вас нужны известные суммы, даты и подтверждения. Если требования предъявлены вам — укажите, с какими суммами вы не согласны.')+choices('money_needed','Нужно ли учитывать деньги в документе?',['Да','Нет','Не знаю'])+(hasMoney()?area('money_summary','Какие суммы нужно учесть или оспорить?','Например: основной долг, возврат оплаты, расходы, компенсация. Можно написать «суммы в документах».')+`<div id="payments">${paymentRows()}</div><button class="btn secondary small" id="add-payment" type="button">+ Добавить известную сумму</button>`+area('money_returned','Что уже выплатили, вернули или зачли?','Суммы, даты и подтверждения. Либо «ничего / не знаю».')+area('money_terms','Есть ли важные договорённости о сроках, процентах или выплатах?','Не считайте самостоятельно. Укажите, в каком документе это есть, или известные условия.'):'')+notice('Можно не добавлять суммы по отдельности, если они однозначно видны в документах. Сообщите о платежах и договорённостях, которых в документах нет.',true);
 case 4:return title('Подтверждения','Какие документы вы передадите?','Отметьте имеющееся. Файлы отправьте юристу отдельно — эта форма их не загружает и не распознаёт.')+choices('documents','Что у вас есть?',DOCS,true)+choices('docs_delivery','Как обстоят дела с отправкой документов?',['Уже отправлены юристу','Отправлю вместе с брифом','Часть отправлена, остальное позже','Нужна помощь: не знаю, что собрать'])+area('missing_docs','Каких документов или подтверждений не хватает?','Где они могут быть и можно ли их получить. Либо «не знаю / всё имеющееся передам».');
 case 5:return title('Завершение','Участники и связь','Данные участников возьмём из документов. Здесь укажите то, чего в них нет, и удобный способ связи.')+input('client_name','Ваши ФИО или название компании','Так, чтобы юрист мог сопоставить бриф с вашим обращением.')+input('contact','Телефон, почта или другой согласованный контакт','Если контакт уже есть у юриста, можно указать «уже есть».')+input('other_party','С кем у вас спор?','Имя, наименование или «указано в документе …». Если участников несколько — перечислите.')+choices('party_data','Есть ли в документах полные данные и адреса участников?',['Да, всех участников','Только часть сведений','Нет','Не знаю'])+(['Только часть сведений','Нет'].includes(val('party_data'))?area('party_missing','Какие данные участников вы можете дополнить?','Известные имена или наименования, адреса и другие реквизиты. Можно указать, что уточните отдельно. Неизвестные сведения не придумывайте.'):'')+input('place','Где происходили события или исполнялись договорённости?','Город или регион. Если мест несколько — перечислите; подробности можно взять из документов.')+area('participants','Кого ещё затрагивает дело?','Например: другой собственник, родитель, работодатель, несколько ответчиков. Если участвует ребёнок, укажите это. Необязательно.')+area('last_note','Что осталось за рамками вопросов?','Только то, что действительно важно для подготовки документа. Необязательно.')+notice('После проверки скачайте ответы и отправьте их юристу вместе с документами. Заполнение формы само по себе ничего не отправляет.');
 case 6:return review();
}}
function render(focus=true){
 const isWelcome=state.step===-1;
 document.body.classList.toggle('welcome',isWelcome);
 $('screen').innerHTML=content();
 $('progress').hidden=isWelcome;
 $('utilities').hidden=isWelcome;
 $('nav').hidden=isWelcome;
 $('progress-label').textContent=isWelcome?'':`Шаг ${state.step+1} из ${STEPS.length}`;
 $('section-label').textContent=isWelcome?'':STEPS[state.step];
 $('progress-fill').style.width=`${Math.max(0,state.step+1)/STEPS.length*100}%`;
 $('progress-bar').setAttribute('aria-valuenow',String(Math.max(0,state.step+1)));
 $('progress-bar').setAttribute('aria-valuetext',isWelcome?'Начало':`Шаг ${state.step+1} из ${STEPS.length}: ${STEPS[state.step]}`);
 $('steps').innerHTML=STEPS.map((label,i)=>`<li><button type="button" class="step-link" data-step="${i}" ${i===state.step?'aria-current="step"':''}><span aria-hidden="true">${i+1}</span>${esc(label)}</button></li>`).join('');
 $('back').hidden=false;
 $('next').hidden=state.step===STEPS.length-1;
 $('next').textContent=returnToReview?'Вернуться к проверке →':state.step===STEPS.length-2?'Проверить ответы →':'Далее →';
 $('error').textContent='';$('status').textContent='';
 document.title=(isWelcome?'Бриф для подготовки документа':STEPS[state.step])+' · Опросный лист';
 if(focus){$('page-title')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
}

function capture(){const previousProfile=val('profile');document.querySelectorAll('[data-key]').forEach(el=>{const k=el.dataset.key;if(el.type==='checkbox')state.answers[k]=[...document.querySelectorAll('input[data-key="'+k+'"]:checked')].map(e=>e.value);else if(el.type!=='radio'||el.checked)state.answers[k]=el.value;});document.querySelectorAll('[data-event]').forEach(el=>{if(state.events[Number(el.dataset.event)])state.events[Number(el.dataset.event)][el.dataset.prop]=el.value;});document.querySelectorAll('[data-payment]').forEach(el=>{if(state.payments[Number(el.dataset.payment)])state.payments[Number(el.dataset.payment)][el.dataset.prop]=el.value;});const previousOutcomes=arr('outcomes');const currentOutcomes=compatibleOutcomes(state.answers);if(currentOutcomes.length!==previousOutcomes.length){state.answers.outcomes=currentOutcomes;if(previousProfile!==val('profile'))$('status').textContent='Выбор результатов обновлён для нового статуса. Проверьте его на следующем шаге.';}}
function validateStart(){
 const missing=[];
 if(!val('profile'))missing.push(['profile','Выберите, в каком качестве вы обращаетесь.']);
 if(!String(val('problem')).trim())missing.push(['problem','Кратко опишите проблему. Если пока трудно сформулировать, напишите об этом.']);
 if(!missing.length)return true;
 if(state.step!==0){state.step=0;returnToReview=false;render();}
 $('error').innerHTML='<h2>Нужно заполнить два вопроса</h2><ul>'+missing.map(([key,text])=>`<li><button type="button" data-error-target="${key}">${esc(text)}</button></li>`).join('')+'</ul>';
 if(missing.length===1)$('error').querySelector('h2').textContent='Нужно заполнить вопрос';
 for(const [key,text]of missing){
  if(key==='problem'){$('f-problem').setAttribute('aria-invalid','true');$('f-problem').setAttribute('aria-describedby','h-problem error-problem');}
  else document.querySelectorAll('input[data-key="profile"]').forEach(el=>{el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby','error-profile');});
  const target=$('error-'+key);if(target)target.textContent=text;
 }
 $('error').focus();$('error').scrollIntoView({block:'start'});return false;
}
function go(n,options={}){
 capture();n=Math.max(-1,Math.min(n,STEPS.length-1));
 if(n>0&&!validateStart())return;
 returnToReview=Boolean(options.reviewEdit);
 state.step=n;render();
 if(!options.fromHistory&&window.history)window.history.pushState({briefStep:n},'');
}

function pairsForStep(n){const a=state.answers;switch(n){
 case 0:return [['Статус',a.profile],['Краткое описание проблемы',a.problem]];
 case 1:return [['Желаемые результаты',compatibleOutcomes(a).join('; ')],['Главный результат',a.priority]];
 case 2:return [...state.events.filter(r=>r.date||r.event).map((r,i)=>[`Событие ${i+1}`,`${r.date||'Дата не указана'} — ${r.event||'Событие не описано'}`]),['Позиция другой стороны',a.opponent],['С чем не согласны',a.disagreement],['Обстоятельства, которые важно учесть',a.weaknesses]];
 case 3:return [['Денежные требования',a.money_needed],...(hasMoney()?[['Какие суммы учитывать',a.money_summary],...state.payments.filter(r=>Object.values(r).some(Boolean)).map((r,i)=>[`Сумма ${i+1}`,[r.purpose,r.amount,r.date,r.proof].filter(Boolean).join(' / ')]),['Выплачено или возвращено',a.money_returned],['Условия расчёта',a.money_terms]]:[])];
 case 4:return [['Имеющиеся документы',arr('documents').join('; ')],['Отправка документов',a.docs_delivery],['Чего не хватает',a.missing_docs]];
 case 5:return [['Ваши ФИО или название компании',a.client_name],['Связь',a.contact],['Другая сторона',a.other_party],['Данные участников в документах',a.party_data],...(['Только часть сведений','Нет'].includes(a.party_data)?[['Дополнение реквизитов',a.party_missing]]:[]),['Место событий',a.place],['Другие участники',a.participants],['Дополнительно',a.last_note]];
 default:return [];
}}
function sections(){return STEPS.slice(0,-1).map((label,i)=>({label,pairs:pairsForStep(i)}));}
function review(){return title('Ответы готовы','Проверьте и сохраните','Вы можете вернуться к любому разделу. Пропущенные ответы будут отмечены в выгрузке — придумывать сведения не нужно.')+notice('Следующий шаг: скачайте файл с ответами или поделитесь им, затем передайте юристу. Документы по делу отправьте отдельно.')+`<div class="actions"><button class="btn" type="button" id="export-text">Скачать ответы (.txt)</button><button class="btn secondary" type="button" id="share">Поделиться файлом</button><button class="btn secondary" type="button" id="print">Печать / PDF</button></div><p class="hint">Выгрузка — обычный текстовый файл (.txt), который удобно читать и обрабатывать. «Печать / PDF» использует функции вашего браузера, если они доступны.</p>`+sections().map((s,i)=>`<section class="review-section"><h2>${esc(s.label)}<button class="btn quiet small" type="button" aria-label="Изменить раздел: ${esc(s.label)}" data-step="${i}">Изменить</button></h2><dl>${s.pairs.map(([l,v])=>`<div class="answer"><dt>${esc(l)}</dt><dd>${esc(v||'Не указано')}</dd></div>`).join('')}</dl></section>`).join('')+`<details><summary>Выгрузка для обработки</summary><p class="hint">JSON содержит введённые ответы. Нужен только если юрист попросил этот формат.</p><button class="btn secondary small" id="export-json" type="button">Скачать JSON</button></details>`;}
function textResult(){return 'КЛИЕНТСКИЙ БРИФ\nВыгружен: '+new Date().toLocaleString('ru-RU')+'\nДокументы передаются отдельно. Пустое поле не означает отрицательный ответ.\n\n'+sections().map(s=>s.label.toUpperCase()+'\n'+s.pairs.map(([l,v])=>l+':\n'+(v||'Не указано')).join('\n\n')).join('\n\n'+'—'.repeat(30)+'\n\n');}
function resultJson(){return {format:'legal-brief-result',version:VERSION,exportedAt:new Date().toISOString(),sections:sections()};}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);}
function saveDraft(){capture();download(JSON.stringify({format:'legal-brief-draft',version:VERSION,state},null,2),'brief-draft.json','application/json');$('status').textContent='Черновик подготовлен к скачиванию. Проверьте, что файл сохранился, прежде чем закрывать вкладку.';}
function normalizeDraft(obj){
 if(obj?.format!=='legal-brief-draft'||![1,VERSION].includes(obj.version)||!obj.state||typeof obj.state.answers!='object'||Array.isArray(obj.state.answers)||obj.state.answers===null)throw new Error('Это не черновик этой формы.');
 const src=obj.state,clean={version:VERSION,answers:{},events:[],payments:[],step:-1};
 const allowed=new Set(['profile','problem','outcomes','priority','opponent','disagreement','weaknesses','money_needed','money_summary','money_returned','money_terms','documents','docs_delivery','missing_docs','client_name','contact','other_party','party_data','party_missing','place','participants','last_note']);
 const multi=new Set(['outcomes','documents']);
 for(const [k,v]of Object.entries(src.answers)){
  if(!allowed.has(k))continue;
  if(multi.has(k)?!Array.isArray(v)||!v.every(x=>typeof x==='string'):typeof v!='string')continue;
  if(JSON.stringify(v).length>100000)throw new Error('Слишком длинный ответ в черновике.');
  clean.answers[k]=v;
 }
 for(const [key,props]of [['events',['date','event']],['payments',['purpose','amount','date','proof']]]){
  if(!Array.isArray(src[key])||src[key].length>100)throw new Error('Неподходящая структура черновика.');
  clean[key]=src[key].map(r=>{if(!r||typeof r!='object')throw new Error('Неподходящая запись.');return Object.fromEntries(props.map(k=>[k,typeof r[k]==='string'?r[k].slice(0,100000):'']));});
 }
 const oldToNew=[0,1,2,2,2,3,4,5,6];
 clean.step=Number.isInteger(src.step)?obj.version===1?(oldToNew[src.step]??0):Math.max(0,Math.min(src.step,STEPS.length-1)):0;
 if(!clean.answers.profile||!String(clean.answers.problem||'').trim())clean.step=0;
 if(Array.isArray(clean.answers.outcomes))clean.answers.outcomes=compatibleOutcomes(clean.answers);
 return clean;
}
document.addEventListener('input',e=>{if(e.target.matches('[data-key],[data-event],[data-payment]')){capture();if($('error').textContent){const key=e.target.dataset.key;const err=$('error-'+key);if(err)err.textContent='';e.target.removeAttribute('aria-invalid');if(key==='profile')document.querySelectorAll('input[data-key="profile"]').forEach(el=>el.removeAttribute('aria-invalid'));$('error').textContent='';}}});
document.addEventListener('change',e=>{const el=e.target;if(!el.matches('[data-key]'))return;capture();const exclusives={outcomes:'Пока не могу сформулировать',documents:'Документов пока нет'};if(exclusives[el.dataset.key]&&el.type==='checkbox'&&el.checked){const x=exclusives[el.dataset.key];state.answers[el.dataset.key]=el.value===x?[x]:arr(el.dataset.key).filter(v=>v!==x);document.querySelectorAll('input[data-key="'+el.dataset.key+'"]').forEach(e=>{e.checked=arr(el.dataset.key).includes(e.value);});}if(['money_needed','party_data'].includes(el.dataset.key)){const focusedValue=el.value,key=el.dataset.key;render(false);[...document.querySelectorAll('input[data-key="'+key+'"]')].find(e=>e.value===focusedValue)?.focus();}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.fill){const field=$('f-'+b.dataset.fill);if(field){if(field.value.trim()&&field.value!==b.dataset.value&&!confirm('Заменить написанный ответ на «'+b.textContent.trim()+'»?'))return;field.value=b.dataset.value;capture();}return;}if(b.dataset.errorTarget){const key=b.dataset.errorTarget;const target=key==='problem'?$('f-problem'):document.querySelector('input[data-key="profile"]');target?.focus();return;}if(b.dataset.step!==undefined){go(Number(b.dataset.step),{reviewEdit:state.step===STEPS.length-1});return;}if(b.dataset.removeEvent!==undefined){capture();if(Object.values(state.events[Number(b.dataset.removeEvent)]||{}).some(v=>String(v).trim())&&!confirm('Удалить заполненное событие? Данные этой записи будут потеряны.'))return;state.events.splice(Number(b.dataset.removeEvent),1);render(false);$('add-event')?.focus();return;}if(b.dataset.removePayment!==undefined){capture();if(Object.values(state.payments[Number(b.dataset.removePayment)]||{}).some(v=>String(v).trim())&&!confirm('Удалить заполненную сумму? Данные этой записи будут потеряны.'))return;state.payments.splice(Number(b.dataset.removePayment),1);render(false);$('add-payment')?.focus();return;}switch(b.id){case 'start':go(0);break;case 'resume':$('import-file').click();break;case 'next':go(returnToReview?STEPS.length-1:Math.min(state.step+1,STEPS.length-1));break;case 'back':go(Math.max(state.step-1,-1));break;case 'add-event':capture();state.events.push({date:'',event:''});render(false);$('event-date-'+(state.events.length-1))?.focus();break;case 'add-payment':capture();state.payments.push({purpose:'',amount:'',date:'',proof:''});render(false);$('pay-'+(state.payments.length-1)+'-purpose')?.focus();break;case 'save-draft':saveDraft();break;case 'load-draft':$('import-file').click();break;case 'reset':if(confirm('Очистить все ответы в этой вкладке? Скачанные файлы останутся у вас.')){state={version:VERSION,answers:{},events:[{date:'',event:''}],payments:[],step:-1};render();}break;case 'export-text':download('\uFEFF'+textResult(),'client-brief.txt','text/plain;charset=utf-8');$('status').textContent='Файл с ответами подготовлен к скачиванию. Отправьте его юристу вместе с документами.';break;case 'export-json':download(JSON.stringify(resultJson(),null,2),'client-brief.json','application/json');$('status').textContent='JSON с ответами подготовлен к скачиванию.';break;case 'print':window.print();break;case 'share':{const f=new File(['\uFEFF'+textResult()],'client-brief.txt',{type:'text/plain'});if(navigator.canShare?.({files:[f]})){try{await navigator.share({files:[f],title:'Ответы на бриф'});$('status').textContent='Файл передан выбранному приложению.';}catch(err){$('status').textContent=err.name==='AbortError'?'Отправка отменена. Ответы остаются в открытой вкладке.':'Не удалось открыть отправку. Используйте «Скачать ответы».';}}else{$('status').textContent='Здесь отправка файла из браузера недоступна. Скачайте ответы и прикрепите файл к сообщению юристу.';}break;}}});
$('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2000000)throw new Error('Размер черновика превышает 2 МБ.');const nextState=normalizeDraft(JSON.parse(await file.text()));if(Object.keys(state.answers).length&&!confirm('Заменить текущие ответы данными из черновика?'))return;state=nextState;returnToReview=false;render();if(window.history)window.history.pushState({briefStep:state.step},'');$('status').textContent='Черновик восстановлен. Можно продолжать.';}catch(err){$('status').textContent='Не удалось открыть черновик: '+(err instanceof SyntaxError?'файл повреждён или имеет неподходящий формат. Выберите ранее сохранённый черновик (.json).':err.message);}finally{e.target.value='';}});
if(window.history){window.history.replaceState({briefStep:-1},'');window.addEventListener('popstate',e=>{const n=e.state?.briefStep;if(!Number.isInteger(n)||n< -1||n>=STEPS.length)return;go(n,{fromHistory:true});});}
window.addEventListener('beforeunload',e=>{if(Object.keys(state.answers).length){e.preventDefault();e.returnValue='';}});
render(false);
</script>
</body>
</html>
